name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # strings.xml is generated, make sure nobody edited it by hand or forgot a language
      - name: Check translations
        run: |
          python3 i18n/gen.py
          git diff --exit-code -- app/src/main/res || { echo "::error::run python3 i18n/gen.py and commit the result"; exit 1; }

      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 not set, using debug key"
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          mkdir out
          cp app/build/outputs/apk/release/app-release.apk "out/mhgu-quest-editor-$(cat VERSION).apk"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: mhgu-quest-editor-apk
          path: out/*.apk

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # one release per version, a rebuild replaces it
          gh release delete "v$(cat VERSION)" --cleanup-tag -y 2>/dev/null || true
          gh release create "v$(cat VERSION)" out/*.apk \
            --title "$(cat VERSION)" \
            --notes "Built from ${GITHUB_SHA::7}."
